name: edk2-aarch64-gunyah 构建
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - name: 部署
      run: |
        sudo apt install -y acpica-tools gcc-aarch64-linux-gnu uuid-dev
    - name: 拉取
      uses: actions/checkout@v6
      with:
        fetch-tags: false
        fetch-depth: 1
        filter: blob:none
        show-progress: false
        submodules: recursive
    - name: 编译
      run: |
        mkdir -p Conf
        make -C BaseTools && . edksetup.sh BaseTools && GCC5_AARCH64_PREFIX=aarch64-linux-gnu- build -a AARCH64 -t GCC5 -b RELEASE -p ArmVirtPkg/ArmVirtGunyah.dsc
    - name: 上传
      uses: actions/upload-artifact@v7
      with:
        name: edk2-aarch64-gunyah.fd
        path: Build/ArmVirtGunyah-AArch64/RELEASE_GCC5/FV/edk2-aarch64-gunyah.fd
        archive: false
        if-no-files-found: error
